version: '3.8'
services:
  manager:
    build:
      context: .
      target: runner
    container_name: crack-hack-manager
    environment:
      - PORT=3000
      - WORKER_URLS=http://worker1:3000,http://worker2:3000,http://worker3:3000
    ports:
      - "3000:3000"
    depends_on:
      - worker1
      - worker2
      - worker3
    command: [ "dist/manager/main.js" ]


  worker1:
    build:
      context: .
      target: runner
    container_name: crack-hack-worker1
    environment:
      - PORT=3000
      - MANAGER_URL=http://manager:3000

    command: [ "dist/worker/main.js" ]


  worker2:
    build:
      context: .
      target: runner
    image: crack-hack:worker2
    container_name: crack-hack-worker2
    environment:
      - PORT=3000
      - MANAGER_URL=http://manager:3000
    command: [ "dist/worker/main.js" ]


  worker3:
    build:
      context: .
      target: runner
    container_name: crack-hack-worker3
    environment:
      - PORT=3000
      - MANAGER_URL=http://manager:3000
    command: ["dist/worker/main.js"]
